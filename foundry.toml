[profile.default]
src = 'src'
test = 'src/test'
out = 'out'
libs = ['lib']
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
# Do not let recursive dependency discovery redirect Spark to Grove's APIs.
auto_detect_remappings = false

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
    "@tokenized-strategy/=lib/tokenized-strategy/src/",
    "@periphery/=lib/tokenized-strategy-periphery/src/",
    # Spark retains master's periphery and its nested TokenizedStrategy 3.0.4.
    "@spark-periphery/=lib/spark-periphery/src/",
    "@spark-tokenized-strategy/=lib/spark-periphery/lib/tokenized-strategy/src/",
    "lib/spark-periphery/:@tokenized-strategy/=lib/spark-periphery/lib/tokenized-strategy/src/",
    "lib/spark-periphery/:@periphery/=lib/spark-periphery/src/",
    "@uniswap-v3-core/=lib/uniswap-v3-core/contracts/",
    "@yearn-vaults/=lib/tokenized-strategy-periphery/lib/yearn-vaults-v3/contracts/",
    "v4-core/=lib/v4-core/src/",
    "ds-test/=lib/forge-std/lib/ds-test/src/",
]

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
